services:
  ssh-manager:
    image: phiil92921/ssh-manager:latest
    container_name: ssh-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production

      # ---------- SSO (optional) ----------
      # Uncomment to enable Single Sign-On via any OIDC provider.
      # Tested with: Keycloak, Authelia, Authentik, Google Workspace
      #
      - SSO_ENABLED=true
      - SSO_ISSUER=http://192.168.178.40:7080/realms/dev
      - SSO_CLIENT_ID=ssh-manager                                                                                                                                                                           
      - SSO_CLIENT_SECRET=iYliO5ozmWDmicBZi6DGJb8RYKfLQlp1                                                                                                                                                  
      - SSO_REDIRECT_URI=http://192.168.178.97:3000/auth/callback                                                                                                                                           
      # - SSO_ALLOWED_ROLES=ssh-manager-users  # optional: restrict by role/group                                                                                                                            
      - SESSION_SECRET=dklgdskgjdlksgljsdgdljskgjlkdskjgkjsdlglkjdslkg
      - SSO_POST_LOGOUT_URI=http://192.168.178.97:3000/
