services:
  ssh-manager:
    image: phiil92921/ssh-manager:latest
    container_name: ssh-manager
    restart: unless-stopped
    # Traefik
    networks:
      - treafik
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - NODE_ENV=production

      # ---------- SSO (optional) ----------
      # Uncomment to enable Single Sign-On via any OIDC provider.
      # Tested with: Keycloak, Authelia, Authentik, Google Workspace
      #
      # - SSO_ENABLED=true
      # - SSO_ISSUER=https://auth.example.com/realms/myrealm
      # - SSO_CLIENT_ID=ssh-manager
      # - SSO_CLIENT_SECRET=your-client-secret
      # - SSO_REDIRECT_URI=http://your-server:3000/auth/callback
      # - SSO_ALLOWED_ROLES=ssh-manager-users  # optional: restrict by role/group
      # - SESSION_SECRET=change-this-to-a-long-random-string
    
    # Traefik 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yourservice.rule=Host(`yourservice.domain`)"
      - "traefik.http.routers.yourservice.entrypoints=websecure"
      - "traefik.http.routers.yourservice.tls=true"
      - "traefik.http.services.yourservice.loadbalancer.server.port=XXXX"
networks:
  traefik:
    external: true

